name: Publish VS Code Extension

# A pushed v* tag on main is the only publish trigger. Anything else (a manual
# dispatch, a branch push) has no way to reach a registry from this workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify ref, test and package
    if: github.repository == 'tsuyoshi-otake/otak-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so merge-base can prove the tag is reachable from main.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch main for the ancestry check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Verify the tag releases the right commit
        run: node scripts/release/check-release-ref.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: xvfb-run -a npm run test:unit:parallel

      - name: Smoke tests
        run: xvfb-run -a npm run test:smoke

      # The sources were scanned by "Lint"; this scans what is actually shipped, so a
      # payload injected into the build output is caught before it reaches a registry.
      - name: Scan shipped artifacts for invisible Unicode
        run: npm run lint:unicode:dist

      - name: Package VSIX
        run: npm run package:vsix

      # The VSIX is what the registries receive; scan its contents too, because
      # `vsce package` recompiles through vscode:prepublish and could in principle
      # carry content that neither the source scan nor the --dist scan covered.
      - name: Scan packaged VSIX for invisible Unicode
        run: |
          mkdir -p "$RUNNER_TEMP/vsix-unpacked"
          unzip -q ./*.vsix -d "$RUNNER_TEMP/vsix-unpacked"
          node scripts/check-invisible-unicode.mjs --dir "$RUNNER_TEMP/vsix-unpacked"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otak-proxy-vsix
          path: '*.vsix'
          if-no-files-found: error

  # Verify both registry tokens up front so a missing secret fails the run
  # before any partial publish.
  check-tokens:
    name: Check registry tokens
    if: github.repository == 'tsuyoshi-otake/otak-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check registry tokens
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is required to publish to Visual Studio Marketplace."
            exit 1
          fi
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT secret is required to publish to the Open VSX Registry."
            exit 1
          fi
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  publish-marketplace:
    name: Publish to Visual Studio Marketplace
    needs: [build, check-tokens]
    if: github.repository == 'tsuyoshi-otake/otak-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otak-proxy-vsix
          path: vsix

      # No duplicate-skip flag: an already-published version must fail so a bad
      # tag surfaces instead of passing silently.
      - name: Publish to Visual Studio Marketplace
        run: npm run deploy -- --packagePath ./vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-ovsx:
    name: Publish to Open VSX Registry
    needs: [build, check-tokens]
    if: github.repository == 'tsuyoshi-otake/otak-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: otak-proxy-vsix
          path: vsix

      - name: Publish to Open VSX Registry
        run: npm run deploy:ovsx -- ./vsix/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
