name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer pull_request push supersedes a run still in flight; every push to
# main is tested to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, test and package
    if: github.repository == 'tsuyoshi-otake/otak-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: xvfb-run -a npm run test:unit:parallel

      - name: Smoke tests
        run: xvfb-run -a npm run test:smoke

      - name: Package VSIX
        run: npm run package:vsix

      # Scan what would actually ship, not only the sources.
      - name: Scan packaged VSIX for invisible Unicode
        run: |
          mkdir -p "$RUNNER_TEMP/vsix-unpacked"
          unzip -q ./*.vsix -d "$RUNNER_TEMP/vsix-unpacked"
          node scripts/check-invisible-unicode.mjs --dir "$RUNNER_TEMP/vsix-unpacked"

      # Fails only on critical advisories but still prints the full report; the
      # known high-severity findings are tracked as a follow-up, not fixed here.
      - name: Audit dependencies
        run: npm audit --audit-level=critical
